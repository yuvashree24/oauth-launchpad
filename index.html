    <script>
      // Safe preview-environment guard for Vite HMR WebSocket connection drops.
      // In AI Studio preview proxies/iframes, HMR WebSockets cannot establish connections.
      // This catches the preview-only rejection safely so it does not pollute preview logs.
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (msg.includes('WebSocket closed without opened') || (msg.includes('WebSocket') && msg.includes('closed'))) {
          event.preventDefault();
        }
      });
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && firstArg.includes('[vite] failed to connect to websocket')) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
